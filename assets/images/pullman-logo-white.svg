<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 82" width="100%" height="100%" fill="none">
  <!-- Panther Head (Facing Right with Left-Trailing Network Circuits - White & Golden Orange) -->
  <g transform="translate(6, 6)">
    <!-- Trailing Horizontal Speed/Circuit Traces (Left) -->
    <path d="M2 18 L24 18 M6 26 L20 26 M0 36 L22 36 M4 46 L26 46 M8 56 L32 56 M14 64 L36 64" stroke="#FFB300" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="2" cy="18" r="2.2" fill="#FFB300"/>
    <circle cx="6" cy="26" r="2" fill="#FFB300"/>
    <circle cx="0" cy="36" r="2.4" fill="#FFB300"/>
    <circle cx="4" cy="46" r="2" fill="#FFB300"/>
    <circle cx="8" cy="56" r="2.2" fill="#FFB300"/>
    <circle cx="14" cy="64" r="2" fill="#FFB300"/>

    <!-- Network Wireframe Internal Mesh -->
    <path d="M24 18 L38 12 L54 8 L68 14 L58 24 L42 22 L24 18 Z" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M20 26 L36 28 L52 26 L66 22 L76 26 M22 36 L38 38 L54 36 L68 34 L82 36" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M26 46 L40 48 L56 46 L68 44 L78 48 M32 56 L46 58 L60 56 L72 58 M36 64 L52 64 L66 66" stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Diagonal Connection Intersects -->
    <path d="M38 12 L36 28 L40 48 L32 56 M54 8 L52 26 L54 36 L46 58 M68 14 L66 22 L68 34 L56 46 M76 26 L68 34 L78 48 L60 56 M58 24 L54 36 L68 44" stroke="#FFFFFF" stroke-width="1.4" stroke-linejoin="round"/>
    <path d="M24 18 L36 28 M20 26 L38 38 M22 36 L40 48 M26 46 L46 58 M38 12 L52 26 M52 26 L68 34" stroke="#FFB300" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Realistic Panther Face Contour (Right Side) -->
    <!-- Ear -->
    <path d="M68 14 L74 6 L78 12 L76 18" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round" fill="none"/>
    <!-- Forehead, Bridge of Nose & Snout -->
    <path d="M76 18 C78 22, 82 28, 86 33 L90 35 L88 38" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Nose Tip, Whiskers & Mouth -->
    <path d="M88 38 L85 41 C82 42, 84 44, 82 46 L78 48" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Chin & Lower Jawline -->
    <path d="M78 48 L76 52 C74 56, 70 60, 66 66" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Eye Detail -->
    <path d="M72 26 L76 28 L72 30 Z" fill="#FFFFFF"/>

    <!-- Network Dots / Nodes -->
    <circle cx="24" cy="18" r="2.5" fill="#FFB300"/>
    <circle cx="38" cy="12" r="2.8" fill="#FFFFFF"/>
    <circle cx="54" cy="8" r="3" fill="#FFB300"/>
    <circle cx="68" cy="14" r="2.8" fill="#FFFFFF"/>
    <circle cx="36" cy="28" r="3.2" fill="#FFB300"/>
    <circle cx="52" cy="26" r="3" fill="#FFFFFF"/>
    <circle cx="66" cy="22" r="2.8" fill="#FFFFFF"/>
    <circle cx="22" cy="36" r="2.5" fill="#FFB300"/>
    <circle cx="38" cy="38" r="3.5" fill="#FFFFFF"/>
    <circle cx="54" cy="36" r="3.2" fill="#FFB300"/>
    <circle cx="68" cy="34" r="3" fill="#FFFFFF"/>
    <circle cx="40" cy="48" r="3.2" fill="#FFFFFF"/>
    <circle cx="56" cy="46" r="3" fill="#FFB300"/>
    <circle cx="46" cy="58" r="2.8" fill="#FFFFFF"/>
    <circle cx="60" cy="56" r="3" fill="#FFB300"/>
  </g>

  <!-- Typography: PULLMAN CONNECT (White & Gold) -->
  <g transform="translate(108, 12)">
    <!-- PULLMAN (Bold Italic Crisp White) -->
    <text x="0" y="27" font-family="'Outfit', 'Plus Jakarta Sans', Arial, sans-serif" font-size="31" font-weight="900" font-style="italic" letter-spacing="0.04em" fill="#FFFFFF">
      PULLMAN
    </text>
    
    <!-- CONNECT (Bold Italic Golden Amber) -->
    <text x="0" y="55" font-family="'Outfit', 'Plus Jakarta Sans', Arial, sans-serif" font-size="28" font-weight="800" font-style="italic" letter-spacing="0.12em" fill="#FFB300">
      CONNECT
    </text>
  </g>
</svg>
